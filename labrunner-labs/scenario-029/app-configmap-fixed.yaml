    import json
    import logging

    class _JsonFormatter(logging.Formatter):
        def format(self, record):
            return json.dumps({
                "timestamp": self.formatTime(record),
                "level": record.levelname,
                "logger": record.name,
                "message": record.getMessage(),
                # FIX 2: uncomment the two lines below to include trace context
                "trace_id": record.__dict__.get("otelTraceID", ""),
                "span_id":  record.__dict__.get("otelSpanID",  ""),
            })

    def setup_logging():
        handler = logging.StreamHandler()
        handler.setFormatter(_JsonFormatter())
        root = logging.getLogger()
        if not root.handlers:
            root.addHandler(handler)
        root.setLevel(logging.INFO)
  main.py: |
    import os
    import random
    import threading
    import time
    import uuid

    from flask import Flask, jsonify
    from opentelemetry import trace

    from logging_setup import setup_logging
    from telemetry import setup_telemetry
    import work

    setup_logging()

    app = Flask(__name__)
    setup_telemetry(app)

    logger = __import__("logging").getLogger(__name__)

    GENERATE_TRAFFIC = os.getenv("GENERATE_TRAFFIC", "false").lower() == "true"
    TRAFFIC_RPS = float(os.getenv("TRAFFIC_RPS", "5"))
    SELF_URL = os.getenv("SELF_URL", "http://localhost:8000")

    @app.get("/healthz")
    def healthz():
        return jsonify({"ok": True})

    @app.get("/")
    def index():
        logger.info("handling request")
        work.do_work()
        return jsonify({"ok": True})

    @app.get("/order/<order_id>")
    def order(order_id):
        logger.info("processing order", extra={"order_id": order_id})
        work.do_work()
        return jsonify({"order_id": order_id, "status": "processed"})

    def _traffic_generator():
        time.sleep(3)
        try:
            import urllib.request
            interval = 1.0 / TRAFFIC_RPS if TRAFFIC_RPS > 0 else 0.2
            while True:
                start = time.monotonic()
                try:
                    if random.random() < 0.5:
                        urllib.request.urlopen(f"{SELF_URL}/", timeout=3)
                    else:
                        oid = uuid.uuid4().hex[:8]
                        urllib.request.urlopen(f"{SELF_URL}/order/{oid}", timeout=3)
                except Exception:
                    pass
                elapsed = time.monotonic() - start
                remaining = interval - elapsed
                if remaining > 0:
                    time.sleep(remaining)
        except Exception:
            pass

    if GENERATE_TRAFFIC:
        t = threading.Thread(target=_traffic_generator, daemon=True)
        t.start()

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8000)
  telemetry.py: |
    import os

    from opentelemetry import trace
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    from opentelemetry.instrumentation.flask import FlaskInstrumentor
    from opentelemetry.instrumentation.logging import LoggingInstrumentor  # imported but never called
    from opentelemetry.sdk.resources import Resource
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.trace.export import BatchSpanProcessor

    def setup_telemetry(app):
        resource = Resource.create({
            "service.name": os.getenv("OTEL_SERVICE_NAME", "trace-log-correlation-demo"),
        })
        provider = TracerProvider(resource=resource)
        provider.add_span_processor(
            BatchSpanProcessor(
                OTLPSpanExporter(
                    endpoint=os.getenv("OTEL_EXPORTER_OTLP_ENDPOINT", "localhost:4317"),
                    insecure=True,
                )
            )
        )
        trace.set_tracer_provider(provider)
        # FIX 1: call LoggingInstrumentor().instrument() here so OTel injects
        # otelTraceID / otelSpanID into every LogRecord while a span is active.
        LoggingInstrumentor().instrument(set_logging_format=False)
        FlaskInstrumentor().instrument_app(app)
  work.py: |
    import logging
    import random
    import time

    from opentelemetry import trace

    logger = logging.getLogger(__name__)

    def do_work():
        tracer = trace.get_tracer(__name__)
        duration = random.uniform(0.01, 0.1)
        with tracer.start_as_current_span("db-query") as span:
            span.set_attribute("db.system", "postgresql")
            span.set_attribute("db.operation", "select")
            span.set_attribute("db.duration_ms", round(duration * 1000))
            time.sleep(duration)
        logger.info("work completed", extra={"duration_ms": round(duration * 1000)})
