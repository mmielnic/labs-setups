# Astronomy Shop — Coralogix EKS Lab
# Helm chart: opentelemetry-demo 0.42.6
# Application version: 3.1.0
# Kubernetes namespace: demo

default:
  envOverrides:
    - name: OTEL_COLLECTOR_NAME
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP

# Use the existing Coralogix collectors.
opentelemetry-collector:
  enabled: false

# Coralogix provides these observability backends.
jaeger:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

opensearch:
  enabled: false
