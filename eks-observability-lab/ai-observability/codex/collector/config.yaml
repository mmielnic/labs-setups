receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp_http/us2:
    endpoint: ${env:CX_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:CX_API_KEY}"
    compression: gzip
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/us2]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/us2]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/us2]
