coralogix-operator:
  enabled: false
distribution: ""
global:
  clusterName: msm-tam-lab-cluster
  collectionInterval: 30s
  defaultApplicationName: otel
  defaultSubsystemName: integration
  deploymentEnvironmentName: aws-eks-lab
  domain: cx498.coralogix.com
  extensions:
    kubernetesDashboard:
      enabled: true
  logLevel: info
  version: 0.0.377
opentelemetry-agent:
  clusterRole:
    clusterRoleBinding:
      name: coralogix-opentelemetry-agent
    name: coralogix-opentelemetry-agent
  config:
    service:
      extensions:
      - health_check
      pipelines:
        logs:
          exporters: []
          processors:
          - memory_limiter
        metrics:
          exporters: []
          processors:
          - memory_limiter
        traces:
          exporters: []
          processors:
          - memory_limiter
      telemetry:
        logs:
          level: '{{ .Values.global.logLevel }}'
        resource:
          cx.agent.type: agent
          service.name: opentelemetry-collector
  distribution: eks
  dnsPolicy: ClusterFirstWithHostNet
  enabled: true
  extraConfig:
    processors:
      transform/dedupe_total:
        error_mode: ignore
        metric_statements:
        - statements:
          - replace_pattern(metric.name, "_total$", "")
      transform/genai_simulation:
        error_mode: ignore
        trace_statements:
        - conditions:
          - |
            resource.attributes["k8s.namespace.name"] == "demo" and resource.attributes["service.name"] == "agent" and span.attributes["gen_ai.operation.name"] == "chat" and span.attributes["gen_ai.request.model"] == "azure/gpt-5.5" and span.attributes["gen_ai.usage.input_tokens"] == nil and span.attributes["gen_ai.usage.output_tokens"] == nil and span.attributes["gen_ai.input.messages"] != nil and span.attributes["gen_ai.output.messages"] != nil
          context: span
          statements:
          - set(span.cache["input_length"], Len(String(span.attributes["gen_ai.input.messages"])))
          - set(span.cache["input_length"], span.cache["input_length"] + Len(String(span.attributes["gen_ai.system_instructions"])))
            where span.attributes["gen_ai.system_instructions"] != nil
          - set(span.cache["input_length"], span.cache["input_length"] + Len(String(span.attributes["gen_ai.tool.definitions"])))
            where span.attributes["gen_ai.tool.definitions"] != nil
          - set(span.cache["output_length"], Len(String(span.attributes["gen_ai.output.messages"])))
          - set(span.attributes["gen_ai.usage.input_tokens"], Int(span.cache["input_length"]
            / 4))
          - set(span.attributes["gen_ai.usage.output_tokens"], Int(span.cache["output_length"]
            / 4))
    service:
      pipelines:
        metrics:
          processors:
          - transform/dedupe_total
        traces:
          processors:
          - transform/genai_simulation
  extraEnvs:
  - name: CORALOGIX_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        key: PRIVATE_KEY
        name: coralogix-keys
  fullnameOverride: coralogix-opentelemetry
  hostNetwork: true
  mode: daemonset
  presets:
    batch:
      enabled: true
    collectorMetrics:
      enabled: true
      scrapeInterval: '{{.Values.global.collectionInterval}}'
    coralogixExporter:
      enabled: true
      pipelines:
      - logs
      - metrics
      - traces
      privateKey: ${env:CORALOGIX_PRIVATE_KEY}
    dbSemConv:
      enabled: true
    fleetManagement:
      agentType: agent
      clusterName: '{{.Values.global.clusterName}}'
      customAttributes: {}
      enabled: true
      supervisor:
        enabled: true
        minimalCollectorConfig: false
    hostEntityEvents:
      enabled: true
    hostMetrics:
      collectionInterval: '{{.Values.global.collectionInterval}}'
      enabled: true
      process:
        enabled: true
    jaegerReceiver:
      enabled: true
    k8sResourceAttributes:
      agentType: agent
      enabled: true
    kubeletMetrics:
      collectionInterval: '{{.Values.global.collectionInterval}}'
      enabled: true
    kubeletPrometheusMetrics:
      enabled: false
      scrapeAll: false
      semconv: true
    kubernetesAttributes:
      enabled: true
      nodeFilter:
        enabled: true
      podStartTime:
        enabled: false
      podUid:
        enabled: false
    kubernetesExtraMetrics:
      enabled: true
      perNode: true
      scrapeAll: false
    logsCollection:
      enabled: true
      extraFilelogOperators: []
      includeCollectorLogs: true
      maxBatchSize: 1000
      maxRecombineLogSize: 1048576
      maxUnmatchedBatchSize: 1
      multilineConfigs: []
      reduceLogAttributes:
        enabled: true
      storeCheckpoints: true
    metadata:
      clusterName: '{{.Values.global.clusterName}}'
      enabled: true
      integrationName: coralogix-integration-helm
    otlpReceiver:
      enabled: true
    pprof:
      enabled: true
    profilesCollection:
      enabled: false
    profilesK8sAttributes:
      enabled: true
      serviceAnnotations:
      - from: pod
        key: app.coralogix.com/service
        tag_name: service.annotation
      serviceLabels:
      - from: pod
        key: app.kubernetes.io/name
        tag_name: service.label
    reduceResourceAttributes:
      enabled: true
    resourceDetection:
      deploymentEnvironmentName: aws-eks-lab
      enabled: true
    semconv:
      enabled: true
    spanMetrics:
      collectionInterval: '{{.Values.global.collectionInterval}}'
      enabled: true
      histogramBuckets:
      - 1ms
      - 4ms
      - 10ms
      - 20ms
      - 50ms
      - 100ms
      - 200ms
      - 500ms
      - 1s
      - 2s
      - 5s
      metricsExpiration: 5m
      transformStatements: []
    spanMetricsMulti:
      collectionInterval: '{{.Values.global.collectionInterval}}'
      configs: []
      enabled: false
      metricsExpiration: 5m
    spanMetricsSanitization:
      enabled: auto
      sanitize_url: true
      sanitizeDatabases:
      - sql
      - redis
      - memcached
      - mongo
      - opensearch
      - es
    statsdReceiver:
      enabled: true
    transactions:
      enabled: true
      waitDuration: 30s
    zipkinReceiver:
      enabled: true
    zpages:
      enabled: true
  provider: aws
  resources:
    limits:
      cpu: 1
      memory: 2G
    requests:
      cpu: 100m
      memory: 128Mi
  startupProbe:
    failureThreshold: 12
    httpGet:
      port: 13133
    initialDelaySeconds: 30
    periodSeconds: 15
  targetAllocator:
    allocationStrategy: per-node
    enabled: false
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator
      tag: v0.162.0
    prometheusCR:
      enabled: true
      scrapeInterval: 30s
    replicas: 1
  tolerations:
  - operator: Exists
